<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kenna Calorie Tracker</title>
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kenna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <header class="topbar">
    <h1 id="titleBtn">Kenna</h1>
    <nav class="nav-tabs">
      <button id="historyBtn" class="nav-btn" type="button">History</button>
      <button id="graphsBtn" class="nav-btn" type="button">Graphs</button>
    </nav>
  </header>

  <div class="progress" id="progress"></div>

  <main id="stepContainer" class="step-container"></main>

  <p class="storage-note">Data is saved only in this browser, on this device.</p>

</div>

<script src="app.js"></script>
</body>
</html>
