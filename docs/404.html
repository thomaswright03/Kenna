<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Page not found · Kenna</title>
<script>
  // The theme chosen in Kenna's Settings, or the system's.
  (function () {
    var pref = 'system';
    try { pref = localStorage.getItem('kenna:theme') || 'system'; } catch (e) { pref = 'system'; }
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  /* The same colours as the app's light and dark themes (style.css). */
  :root {
    color-scheme: light;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --accent: #15803d;
    --accent-text: #15803d;
    --on-accent: #ffffff;
    --focus: #2563eb;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-text: #4ade80;
    --on-accent: #052e16;
    --focus: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .card { max-width: 420px; margin: 0 auto; padding: 24px 16px; border-radius: 16px; background: var(--card); text-align: center; }
  .brand { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-text); }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body>
<main class="card">
  <p class="brand">Kenna</p>
  <h1>Page not found</h1>
  <p>There’s nothing at this address in Kenna. Your days and photos aren’t affected.</p>
  <a class="btn" id="open-kenna" href="./">Open Kenna</a>
</main>
<script>
  // This page is shown for any missing address, however deep, so the link
  // is worked out from where Kenna lives: /<repository>/ on a GitHub Pages
  // project site (github.io), the site's root anywhere else.
  (function () {
    var first = location.pathname.split('/')[1];
    var base = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';
    document.getElementById('open-kenna').setAttribute('href', base);
  })();
</script>
</body>
</html>
